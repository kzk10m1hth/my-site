<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>フットサル同好会</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&amp;family=Zen+Kaku+Gothic+New:wght@500;900&amp;display=swap">
<style>
[hidden]{display:none!important}
:root{--bg:#0b0b0d;--card:#17171a;--line:#2a2a30;--text:#f2f2ee;--sub:#c2c2ca;--acc:#4de1ff;
--num:"Barlow Condensed","Arial Narrow",sans-serif;--body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:var(--bg);scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-weight:500;line-height:1.7;font-size:1.0625rem}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-bottom:1px solid var(--line);padding:0 16px;height:52px}
.logo{font-family:var(--num);font-style:italic;font-weight:800;font-size:1.5rem;letter-spacing:.04em}
.logo i{color:var(--acc);font-style:inherit}
.bar nav a{color:var(--text);text-decoration:none;font-weight:900;font-size:1.05rem;margin-left:18px}
a:focus-visible,#go:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.hero{position:relative;overflow:hidden;padding:44px 16px 36px}
.hero::after{content:"";position:absolute;top:0;right:-40px;width:55%;height:100%;background:var(--acc);opacity:.1;transform:skewX(-18deg)}
.wrap{position:relative;max-width:640px;margin:0 auto;z-index:1}
h1{font-weight:900;font-size:clamp(2.6rem,13vw,4.6rem);line-height:1.1;margin:0 0 6px;letter-spacing:-.02em}
.lead{color:var(--text);font-size:1.15rem;margin:0 0 28px}
.next{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;align-items:end;border-top:4px solid var(--acc);padding-top:14px}
.next .big{font-family:var(--num);font-style:italic;font-weight:800;font-size:5.6rem;line-height:.9;grid-row:span 3}
.next .chip{justify-self:start;background:var(--acc);color:#0b0b0d;font-weight:900;padding:0 10px;font-size:.85rem}
.next b{font-size:1.6rem;font-weight:900}
.next span{color:var(--text);font-size:1.05rem}
section{max-width:640px;margin:0 auto;padding:48px 16px 8px}
h2{font-family:var(--num);font-style:italic;font-weight:800;font-size:3.2rem;line-height:1;margin:0 0 22px;letter-spacing:.02em;border-left:8px solid var(--acc);padding-left:12px}
h2 small{font-family:var(--body);font-style:normal;font-weight:900;font-size:1.2rem;color:var(--text);margin-left:12px}
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 10px}
.card{flex:0 0 250px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--acc);padding:18px}
.card .n{font-family:var(--num);font-style:italic;font-weight:800;font-size:3.8rem;line-height:1}
.card .n em{font-style:normal;font-size:1.3rem;color:var(--acc);margin-left:6px}
.card b{display:block;margin-top:8px;font-size:1.3rem}
.card span{display:block;margin-top:10px;color:var(--text);font-size:1rem}
#add,#padd{display:grid;gap:8px;background:var(--card);border:1px solid var(--line);padding:14px;margin-bottom:20px}
#add input,#add button,#padd input,#padd button{font:inherit;padding:9px;border:1px solid var(--line);border-radius:0;background:var(--bg);color:var(--text)}
#go,#pgo{background:var(--acc);color:#0b0b0d;border:0;font-weight:900;padding:12px}
#padd{margin-top:14px}
.del{margin-top:10px;font:inherit;font-size:.8rem;background:none;color:var(--sub);border:1px solid var(--line);padding:2px 8px;cursor:pointer}
.rec{margin-bottom:26px}
.rec .d{font-family:var(--num);font-style:italic;font-weight:800;font-size:2rem;color:var(--acc)}
.media{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin:6px -16px 0}
.media img,.media video{width:100%;aspect-ratio:4/5;object-fit:cover;background:#000;display:block}
.media img:only-child{grid-column:1/-1;aspect-ratio:4/3}
#add,#padd{margin-top:14px}
#tools{margin-top:14px}
#tools input{font:inherit;padding:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);width:100%;box-sizing:border-box;margin-bottom:8px;border-radius:0}
#tools button{font:inherit;padding:12px;border:0;background:var(--acc);color:#0b0b0d;font-weight:900;width:100%}
#lb .lbd{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);right:50%;transform:translateX(50%);font-size:1rem;background:#c0392b;padding:10px 18px}
.del{margin-top:10px;font:inherit;font-size:.85rem;background:none;color:var(--sub);border:1px solid var(--line);padding:2px 8px;cursor:pointer}
.note{color:var(--sub);font-size:1rem}
.join{border:1px solid var(--line);padding:24px 20px;text-align:center}
.join h2{margin-bottom:8px}
.join p{margin:0 0 16px}
footer{text-align:center;color:var(--sub);font-size:.8rem;padding:36px 16px 24px}
footer a{color:var(--sub);margin-left:14px}
#lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
#lb button{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;font-size:2.2rem;line-height:1;color:#fff;background:none;border:0;padding:6px 12px}
.media img{cursor:zoom-in}
@media print{
@page{size:A4;margin:0}
:root{padding:0}
html{background:var(--bg)}
body{margin:0;padding:0;font-size:10pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body::before,.bar,footer,#add,#padd,.del,#lb,#tools{display:none!important}
.hero{padding:8mm 8mm 3mm}
.wrap{max-width:none}
h1{font-size:28pt;margin:0 0 3px}
.lead{margin:0 0 3mm!important;font-size:9pt!important}
.next{padding-top:8px}
.next .big{font-size:3.6rem}
.next b{font-size:1.1rem}
section{max-width:none;margin:0;width:auto;padding:3mm 8mm 0}
h2{font-size:17pt;margin:0 0 2mm;padding-left:8px}
.rail{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.card{flex:0 0 calc(25% - 8px);padding:5px 8px}
.card .n{font-size:1.6rem}
.card .n em{font-size:.85rem}
.card span{margin-top:1px;font-size:.7rem}
.card:nth-child(n+9){display:none}
.rec{margin:0 0 3mm;break-inside:avoid}
.rec .d{font-size:1.2rem}
.rec:nth-child(n+4){display:none}
.media{display:grid;grid-template-columns:repeat(4,1fr);gap:2mm;margin:1mm 0 0}
.media img{width:100%;height:28mm;aspect-ratio:auto;object-fit:cover;grid-column:auto}
.rec:first-child:nth-last-child(-n+2) .media img{height:42mm}
.media img:only-child{grid-column:span 2}
.media img:nth-child(n+5){display:none}
}
</style>

<script>
(function(){
var seed=JSON.parse(document.getElementById('seed').textContent),S=seed,W='日月火水木金土',edit=false,evId=null,recId=null,lbR=null,lbI=0,pw='',dirty=false;
try{pw=localStorage.getItem('fpw')||'';}catch(e){}
function $(i){return document.getElementById(i);}
function h(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
function pad(n){return String(n).padStart(2,'0');}
function say(t){$('msg').textContent=t||'';}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function btn(label,fn,two){var b=h('button','del',label),a=false;b.onclick=function(){if(two&&!a){a=true;b.textContent='もう一度押すと削除';return;}fn();};return b;}
function openLb(u,r,i){var l=$('lb');l.querySelector('img').src=u;lbR=r;lbI=i;var d=$('lbdel');d.hidden=!edit;d.textContent='この写真を削除';l.className='on';}
function closeLb(){var l=$('lb');l.className='';l.querySelector('img').removeAttribute('src');}
function render(){
var nx=$('next'),rail=$('rail'),box=$('recs');nx.textContent='';rail.textContent='';box.textContent='';
var n0=new Date(),t0=new Date(n0.getFullYear(),n0.getMonth(),n0.getDate());
var up=S.events.map(function(o){var d=new Date(o.d+'T00:00:00');return {o:o,d:d,n:Math.round((d-t0)/864e5)};}).filter(function(r){return r.n>=0;});
if(!up.length){nx.appendChild(h('span','','次の予定は調整中です'));}
else{var f=up[0];
nx.appendChild(h('div','big',(f.d.getMonth()+1)+'.'+pad(f.d.getDate())));
nx.appendChild(h('div','chip',f.n===0?'今日':'あと'+f.n+'日'));
nx.appendChild(h('b','',W[f.d.getDay()]+'曜日'));
nx.appendChild(h('span','',[f.o.time,f.o.p].filter(Boolean).join(' / ')));}
up.forEach(function(r){var c=h('div','card'),n=h('div','n',(r.d.getMonth()+1)+'.'+pad(r.d.getDate()));
n.appendChild(h('em','',W[r.d.getDay()]));c.appendChild(n);
var x=[r.o.time,r.o.p].filter(Boolean).join(' / ');if(x)c.appendChild(h('span','',x));
if(edit){c.appendChild(btn('変更',function(){evId=r.o.id;$('pd').value=r.o.d;$('ptime').value=r.o.time||'';$('pp').value=r.o.p||'';$('pgo').textContent='変更を保存';$('padd').scrollIntoView({block:'center'});}));
c.appendChild(btn('削除',function(){S.events=S.events.filter(function(e){return e.id!==r.o.id;});commit();},true));}
rail.appendChild(c);});
S.records.forEach(function(r){var e=h('div','rec');e.appendChild(h('div','d',r.date.replace(/-/g,'.')));
if(r.text)e.appendChild(h('div','',r.text));
var m=h('div','media');(r.imgs||[]).forEach(function(u,k){var i=document.createElement('img');i.src=u;i.alt='活動写真';i.loading='lazy';i.onclick=function(){openLb(u,r,k);};m.appendChild(i);});
if(m.children.length)e.appendChild(m);
if(edit){e.appendChild(btn('変更',function(){recId=r.id;$('d').value=r.date;$('t').value=r.text||'';$('go').textContent='変更を保存';$('add').scrollIntoView({block:'center'});}));
e.appendChild(btn('削除',function(){S.records=S.records.filter(function(x){return x.id!==r.id;});commit();},true));}
box.appendChild(e);});
}
async function save(){
if(!pw){say('パスワードを入れて「保存する」を押してください');return;}
say('保存中…');
try{
var r=await fetch('/api/site',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw,state:S})});
if(r.status===401){say('パスワードが違います');return;}
if(!r.ok){say('保存できませんでした('+r.status+')');return;}
var d=await r.json();S=d.state;dirty=false;
try{localStorage.setItem('fpw',pw);}catch(e){}
say('保存しました');render();
}catch(e){say('保存できませんでした(通信を確認してください)');}
}
function commit(){render();dirty=true;save();}
function shrink(file){return new Promise(function(ok,ng){var fr=new FileReader();
fr.onerror=function(){ng(new Error('ファイルを読み込めません'));};
fr.onload=function(){var i=new Image();
i.onload=function(){var r=Math.min(1,1000/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*r);c.height=Math.round(i.height*r);c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.78));};
i.onerror=function(){ng(new Error('画像を開けません(形式未対応)'));};i.src=fr.result;};
fr.readAsDataURL(file);});}
$('lb').onclick=closeLb;
$('lbdel').onclick=function(e){e.stopPropagation();var b=$('lbdel');
if(b.textContent!=='本当に削除'){b.textContent='本当に削除';return;}
lbR.imgs.splice(lbI,1);closeLb();commit();};
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLb();});
$('pgo').onclick=function(){var d=$('pd').value;if(!d){say('日付を入れてください');return;}
var v={d:d,time:$('ptime').value.trim(),p:$('pp').value.trim()};
if(evId){S.events.forEach(function(e){if(e.id===evId){e.d=v.d;e.time=v.time;e.p=v.p;}});}else{v.id=id();S.events.push(v);}
S.events.sort(function(a,b){return a.d<b.d?-1:1;});
evId=null;$('pgo').textContent='予定を追加';$('ptime').value='';$('pp').value='';commit();};
$('go').onclick=async function(){
var files=[].slice.call($('f').files),text=$('t').value.trim();
if(!recId&&!files.length&&!text){say('写真かひとことを入れてください');return;}
$('go').disabled=true;say('写真を準備中…');
try{var imgs=[];for(var k=0;k<files.length;k++)imgs.push(await shrink(files[k]));
if(recId){S.records.forEach(function(r){if(r.id===recId){r.date=$('d').value;r.text=text;r.imgs=(r.imgs||[]).concat(imgs);}});}
else S.records.push({id:id(),date:$('d').value,text:text,imgs:imgs});
S.records.sort(function(a,b){return a.date<b.date?1:-1;});
recId=null;$('go').textContent='投稿する';$('f').value='';$('t').value='';commit();}
catch(e){say('投稿できませんでした:'+(e&&e.message?e.message:''));}
$('go').disabled=false;};
$('exp').onclick=save;
$('pw').value=pw;$('pw').oninput=function(){pw=$('pw').value;};
$('d').value=new Date().toISOString().slice(0,10);
function setEdit(){edit=true;$('padd').hidden=false;$('add').hidden=false;$('tools').hidden=false;render();}
function chk(){if(location.hash==='#edit'&&!edit)setEdit();}
render();chk();window.addEventListener('hashchange',chk);
fetch('/api/site',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){if(d&&d.events&&d.records&&!dirty){S=d;render();}}).catch(function(){});
})();
</script>
